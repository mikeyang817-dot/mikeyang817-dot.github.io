name: Deploy React UI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-ui/package-lock.json

      - name: Install dependencies
        working-directory: react-ui
        run: npm ci

      - name: Build React site
        working-directory: react-ui
        run: npm run build

      - name: Prepare direct routes
        run: |
          mkdir -p react-ui/dist/articles
          mkdir -p react-ui/dist/projects
          mkdir -p react-ui/dist/life
          mkdir -p react-ui/dist/life/gallery
          mkdir -p react-ui/dist/about

          cp react-ui/dist/index.html react-ui/dist/articles/index.html
          cp react-ui/dist/index.html react-ui/dist/projects/index.html
          cp react-ui/dist/index.html react-ui/dist/life/index.html
          cp react-ui/dist/index.html react-ui/dist/life/gallery/index.html
          cp react-ui/dist/index.html react-ui/dist/about/index.html
          cp react-ui/dist/index.html react-ui/dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./react-ui/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
